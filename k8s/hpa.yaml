
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: activity-2b-api
  namespace: activity-2b
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: activity-2b-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
