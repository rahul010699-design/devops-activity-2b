apiVersion: batch/v1
kind: Job
metadata:
  name: activity-2b-db-init
  namespace: activity-2b
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: activity-2b-db-init
    spec:
      serviceAccountName: activity-2b-app
      restartPolicy: Never
      containers:
        - name: initialize-database
          image: asia-south1-docker.pkg.dev/lunar-works-316500/devops-gcp-repo/activity-2b-api:v1
          command: ["python", "app/init_db.py"]
          env:
            - name: GCP_PROJECT_ID
              value: "lunar-works-316500"
            - name: DB_PASSWORD_SECRET
              value: "activity-2b-dev-postgres-password"
            - name: DB_HOST
              value: "10.50.0.11"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "activity2b"
            - name: DB_USER
              value: "activity2b_user"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
